# TLS terminator. uvicorn binds to 127.0.0.1 only; nothing reaches it except
# through here. Put a real internal-CA cert in place before pilot -- a browser
# extension will not send to a host it cannot verify.

server {
    listen 443 ssl;
    server_name dlp.internal.fortbendcountytx.gov;

    ssl_certificate     /etc/ssl/dlp/fullchain.pem;
    ssl_certificate_key /etc/ssl/dlp/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # End-of-day batches from a busy workstation can be large.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name dlp.internal.fortbendcountytx.gov;
    return 301 https://$host$request_uri;
}
